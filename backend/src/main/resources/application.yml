spring:
  application:
    name: docai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${DB_USER:docai}
    password: ${DB_PASSWORD:docai}
  jpa:
    hibernate:
      ddl-auto: validate          # lo schema lo gestisce Flyway, Hibernate controlla soltanto
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # Validazione delle firme JWT con le chiavi pubbliche di Keycloak
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/docai/protocol/openid-connect/certs}

