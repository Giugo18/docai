spring:
  application:
    name: docai
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/docai}
    username: ${DB_USER:docai}
    password: ${DB_PASSWORD:docai}
  jpa:
    hibernate:
      ddl-auto: validate          # lo schema lo gestisce Flyway, Hibernate controlla soltanto
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  security:
    oauth2:
      resourceserver:
        jwt:
          # chi deve aver emesso il token (claim "iss")
          issuer-uri: ${ISSUER_URI:http://localhost:8180/realms/docai}
          # Validazione delle firme JWT con le chiavi pubbliche di Keycloak
          jwk-set-uri: ${JWK_SET_URI:http://localhost:8180/realms/docai/protocol/openid-connect/certs}

# ===== Settimana 6+: decommenta e verifica i nomi delle proprietà sulla documentazione di Spring AI 2.0 =====
  ai:
    model:
      chat: ${AI_CHAT:ollama}          # chi genera il testo: ollama (locale) oppure openai (= Groq)
      embedding: ollama                # i vettori restano sempre su Ollama (bge-m3)
      image: none                      # funzioni OpenAI che non usiamo: spente
      audio.speech: none
      audio.transcription: none
      moderation: none
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: ${GROQ_MODEL:openai/gpt-oss-120b}
        max-completion-tokens: 2048
        extra-body:
          include_reasoning: false
          reasoning_effort: low
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        model: llama3.2
      embedding:
        model: bge-m3
    vectorstore:
      pgvector:
        initialize-schema: false      # la tabella la crea Flyway
        dimensions: 768
        distance-type: COSINE_DISTANCE
        index-type: HNSW
    mcp:
      server:
        name: docai
        version: 0.1.0
        protocol: STREAMABLE      # endpoint predefinito: /mcp
#          model: llama3.2
#      embedding:
#        options:
#          model: nomic-embed-text
#    vectorstore:
#      pgvector:
#        initialize-schema: true
#        dimensions: 768           # dimensione degli embedding di nomic-embed-text
#        index-type: HNSW
#        distance-type: COSINE_DISTANCE
  threads:
    virtual:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  forward-headers-strategy: framework   # usa X-Forwarded-Proto/Host: siamo dietro a nginx e Caddy
  #tomcat:
    #threads:
      #max: 10
logging:
  level:
    it.docai.rag: debug
docai:
  valutazione:
    attiva: ${VALUTAZIONE_ATTIVA:true}

