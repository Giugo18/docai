server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # upload fino a 20 MB, come in Spring (spring.servlet.multipart.max-file-size)
    client_max_body_size 20m;

    # le API vanno al backend (stesso ruolo di proxy.conf.json in sviluppo)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # tutto il resto è l'app Angular: un URL sconosciuto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}