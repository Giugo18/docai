# se davanti c'è Caddy usa il suo schema (https), altrimenti quello di nginx
map $http_x_forwarded_proto $schema_originale {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # upload fino a 20 MB, come in Spring (spring.servlet.multipart.max-file-size)
    client_max_body_size 20m;

    # le API vanno al backend (stesso ruolo di proxy.conf.json in sviluppo)
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $schema_originale;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
        # configurazione dell'ambiente letta da main.ts all'avvio
    location = /config.json {
        add_header Cache-Control "no-cache";   # il browser deve sempre chiedere a nginx se è cambiato
    }
    # tutto il resto è l'app Angular: un URL sconosciuto torna a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}