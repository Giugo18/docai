<h2>I miei documenti</h2>

@if (documenti().length === 0) {
  <p>Nessun documento caricato.</p>
} @else {
  <table>
    <thead>
      <tr>
        <th>Nome</th>
        <th>Dimensione</th>
        <th>Stato</th>
        <th>Caricato il</th>
      </tr>
    </thead>
    <tbody>
      @for (d of documenti(); track d.id) {
        <tr>
          <td><a [routerLink]="['/documenti', d.id]">{{ d.nomeFile }}</a></td>
          <td>{{ d.dimensione / 1024 / 1024 | number: '1.1-1' }} MB</td>
          <td>{{ d.stato }}</td>
          <td>{{ d.caricatoIl | date: 'dd/MM/yyyy HH:mm' }}</td>
        </tr>
      }
    </tbody>
  </table>
}
