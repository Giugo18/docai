<section class="rounded-xl border border-slate-200 bg-white p-4">
  <h2 class="text-lg font-semibold">Carica un documento</h2>

  <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center">
    <input type="file" (change)="scegli($event)"
           class="w-full text-sm text-slate-600 sm:flex-1
                  file:mr-3 file:cursor-pointer file:rounded-lg file:border-0
                  file:bg-slate-100 file:px-3 file:py-2 file:font-medium file:text-slate-700
                  hover:file:bg-slate-200" />

    <button type="button" (click)="invia()" [disabled]="!file() || inCaricamento()"
            class="cursor-pointer rounded-lg bg-blue-600 px-4 py-2 text-sm font-medium text-white
                   hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50">
      {{ inCaricamento() ? 'Caricamento…' : 'Carica' }}
    </button>
  </div>

  @if (messaggio()) {
    <p class="mt-3 text-sm"
       [class.text-green-700]="esito() === 'ok'"
       [class.text-red-700]="esito() === 'errore'">
      {{ messaggio() }}
    </p>
  }
</section>
