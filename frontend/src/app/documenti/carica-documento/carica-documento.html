<section class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
  <h2 class="text-lg font-semibold text-slate-900 dark:text-slate-100">Carica un documento</h2>

  <div class="mt-3 flex flex-col gap-3 sm:flex-row sm:items-center">
    <input type="file" (change)="scegli($event)" aria-label="Scegli un file PDF"
           class="w-full text-sm text-slate-600 sm:flex-1 dark:text-slate-400
                  file:mr-3 file:cursor-pointer file:rounded-lg file:border-0
                  file:bg-slate-100 file:px-3 file:py-2 file:font-medium file:text-slate-700
                  hover:file:bg-slate-200
                  dark:file:bg-slate-800 dark:file:text-slate-200 dark:hover:file:bg-slate-700" />

    <button type="button" (click)="invia()" [disabled]="!file() || inCaricamento()"
            class="cursor-pointer rounded-lg bg-inchiostro px-4 py-2 text-sm font-medium text-white
                   hover:bg-[#16304F] disabled:cursor-not-allowed disabled:opacity-50
                   dark:bg-ambra dark:text-notte dark:hover:bg-[#F0B85F]">
      {{ inCaricamento() ? 'Caricamento…' : 'Carica' }}
    </button>
  </div>

  @if (messaggio()) {
    <p role="status" class="mt-3 text-sm"
       [class]="esito() === 'ok' ? 'text-green-700 dark:text-green-400' : 'text-red-700 dark:text-red-400'">
      {{ messaggio() }}
    </p>
  }
</section>
