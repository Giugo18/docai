@if (riepilogo(); as r) {
  <section class="grid grid-cols-2 gap-3 sm:grid-cols-4">
    <div class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
      <p class="text-sm text-slate-500 dark:text-slate-400">{{ r.totale === 1 ? 'Documento' : 'Documenti' }}</p>
      <p class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100">{{ r.totale }}</p>
    </div>

    <div class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
      <p class="text-sm text-slate-500 dark:text-slate-400">Spazio usato</p>
      <p class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100">{{ r.dimensioneTotale / 1048576 | number: '1.1-1' }} MB</p>
    </div>

    @for (voce of r.perStato | keyvalue; track voce.key) {
      <div class="rounded-xl border border-slate-200 bg-white p-4 dark:border-slate-800 dark:bg-slate-900">
        <p class="text-sm text-slate-500 dark:text-slate-400">{{ voce.key }}</p>
        <p class="mt-1 text-2xl font-semibold text-slate-900 dark:text-slate-100">{{ voce.value }}</p>
      </div>
    }
  </section>
}
