<a routerLink="/documenti" class="text-sm text-slate-600 hover:text-blue-600">← Torna ai documenti</a>

@if (documento(); as d) {
  <section class="mt-4 rounded-xl border border-slate-200 bg-white p-4 sm:p-6">
    <div class="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
      <h2 class="break-all text-xl font-semibold">{{ d.nomeFile }}</h2>
      <span class="self-start rounded-full px-2 py-0.5 text-xs font-medium" [class]="coloriStato[d.stato]">{{ d.stato }}</span>
    </div>

    <dl class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2">
      <div>
        <dt class="text-sm text-slate-500">Dimensione</dt>
        <dd class="mt-1 font-medium">{{ d.dimensione / 1048576 | number: '1.1-1' }} MB</dd>
      </div>
      <div>
        <dt class="text-sm text-slate-500">Caricato il</dt>
        <dd class="mt-1 font-medium">{{ d.caricatoIl | date: 'dd/MM/yyyy HH:mm' }}</dd>
      </div>
      <div class="sm:col-span-2">
        <dt class="text-sm text-slate-500">ID</dt>
        <dd class="mt-1 break-all font-mono text-sm text-slate-700">{{ d.id }}</dd>
      </div>
    </dl>
  </section>
} @else if (errore()) {
  <p class="mt-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700">{{ errore() }}</p>
} @else {
  <p class="mt-4 text-sm text-slate-500">Caricamento…</p>
}
