<section class="rounded-xl border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900">
  <h2 class="px-4 pt-4 text-lg font-semibold text-slate-900 dark:text-slate-100">Statistiche per utente</h2>

  @if (righe(); as righe) {
    <table class="mt-2 w-full text-left text-sm">
      <thead class="border-b border-slate-200 text-slate-500 dark:border-slate-800 dark:text-slate-400">
        <tr>
          <th class="px-4 py-3 font-medium">Utente (ID Keycloak)</th>
          <th class="px-4 py-3 text-right font-medium">Documenti</th>
          <th class="px-4 py-3 text-right font-medium">Spazio</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100 text-slate-900 dark:divide-slate-800 dark:text-slate-100">
        @for (r of righe; track r.proprietario) {
          <tr>
            <td class="break-all px-4 py-3 font-mono text-xs text-slate-700 dark:text-slate-300">{{ r.proprietario }}</td>
            <td class="px-4 py-3 text-right tabular-nums">{{ r.documenti }}</td>
            <td class="whitespace-nowrap px-4 py-3 text-right tabular-nums">{{ r.dimensione / 1048576 | number: '1.1-1' }} MB</td>
          </tr>
        }
      </tbody>
    </table>
  } @else if (errore()) {
    <p class="m-4 rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-700 dark:border-red-800 dark:bg-red-950/40 dark:text-red-300">{{ errore() }}</p>
  } @else {
    <p class="p-4 text-sm text-slate-500 dark:text-slate-400">Caricamento…</p>
  }
</section>
