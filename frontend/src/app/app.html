<div class="flex min-h-screen flex-col">
<header class="border-b border-slate-200 bg-white dark:border-slate-800 dark:bg-notte">
    <!-- Una sola riga che va a capo: l'ordine cambia con order-* (telefono: logo, controlli / link sotto) -->
    <div class="mx-auto flex max-w-5xl flex-wrap items-center gap-x-6 gap-y-2 px-4 py-3">
        <a routerLink="/" class="order-1 flex items-center">
            <img src="logo-orizzontale.svg" alt="Leggio18" class="h-8 dark:hidden">
            <img src="logo-orizzontale-scuro.svg" alt="Leggio18" class="h-8 hidden dark:block">
        </a>

        @if (autenticato) {
        <!-- telefono: seconda riga larga tutto lo schermo; da sm in su: in mezzo, sulla stessa riga -->
        <nav class="order-3 flex w-full gap-5 text-sm font-medium sm:order-2 sm:w-auto sm:gap-4">
            <a routerLink="/documenti" routerLinkActive ariaCurrentWhenActive="page"
                class="text-slate-600 hover:text-inchiostro aria-[current=page]:text-inchiostro dark:text-slate-300 dark:hover:text-ambra dark:aria-[current=page]:text-ambra">Documenti</a>
            <a routerLink="/chat" routerLinkActive ariaCurrentWhenActive="page"
                class="text-slate-600 hover:text-inchiostro aria-[current=page]:text-inchiostro dark:text-slate-300 dark:hover:text-ambra dark:aria-[current=page]:text-ambra">Chat</a>
            <a routerLink="/chiedi" routerLinkActive ariaCurrentWhenActive="page"
                class="text-slate-600 hover:text-inchiostro aria-[current=page]:text-inchiostro dark:text-slate-300 dark:hover:text-ambra dark:aria-[current=page]:text-ambra">Chiedi</a>
        </nav>
        }

        <!-- controlli: sempre a destra (ml-auto), sulla prima riga anche sul telefono -->
        <div class="order-2 ml-auto flex items-center gap-3 sm:order-3">
            <button type="button" role="switch" [attr.aria-checked]="temi.scuro()" aria-label="Tema scuro"
                [title]="temi.scuro() ? 'Passa al tema chiaro' : 'Passa al tema scuro'" (click)="temi.alterna()"
                class="cursor-pointer rounded-lg border border-slate-300 p-2 text-slate-600 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-300 dark:hover:bg-slate-800">
                @if (temi.scuro()) {
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                } @else {
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                }
            </button>

            @if (autenticato) {
            <div class="relative" #menuUtente>
                <button type="button" (click)="apriChiudiMenu()" aria-haspopup="menu" [attr.aria-expanded]="menuAperto()" aria-controls="menu-utente"
                    [attr.aria-label]="'Menu di ' + nomeUtente"
                    class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-300 py-1 pl-1 pr-2 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800">
                    <span aria-hidden="true" class="flex h-7 w-7 items-center justify-center rounded-md bg-inchiostro text-xs font-semibold text-white dark:bg-ambra dark:text-notte">{{ iniziale }}</span>
                    <span class="hidden sm:inline">{{ nomeUtente }}</span>   <!-- sul telefono basta l'iniziale -->
                    <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        class="transition-transform" [class.rotate-180]="menuAperto()"><path d="M6 9l6 6 6-6"/></svg>
                </button>

                @if (menuAperto()) {
                <div id="menu-utente" role="menu" aria-label="Menu utente"
                    class="absolute right-0 z-20 mt-2 w-60 max-w-[calc(100vw-2rem)] overflow-hidden rounded-lg border border-slate-200 bg-white py-1 shadow-lg dark:border-slate-700 dark:bg-notte">
                    <div class="border-b border-slate-200 px-4 py-2 dark:border-slate-700">
                        <p class="text-sm font-semibold text-slate-900 dark:text-slate-100">{{ nomeUtente }}</p>
                        @if (email) {
                        <p class="truncate text-xs text-slate-500 dark:text-slate-400">{{ email }}</p>
                        }
                    </div>
                    @if (admin) {
                    <a role="menuitem" routerLink="/admin" (click)="chiudiMenu()"
                        class="block px-4 py-2 text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800">Amministrazione</a>
                    }
                    <button role="menuitem" type="button" (click)="cambiaPassword()"
                        class="block w-full cursor-pointer px-4 py-2 text-left text-sm text-slate-700 hover:bg-slate-100 dark:text-slate-200 dark:hover:bg-slate-800">Cambia password</button>
                    <div class="my-1 border-t border-slate-200 dark:border-slate-700"></div>
                    <button role="menuitem" type="button" (click)="esci()"
                        class="block w-full cursor-pointer px-4 py-2 text-left text-sm text-red-600 hover:bg-slate-100 dark:text-red-400 dark:hover:bg-slate-800">Esci</button>
                </div>
                }
            </div>
            } @else {
            <button type="button" (click)="entra()"
                class="cursor-pointer rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100 dark:border-slate-600 dark:text-slate-200 dark:hover:bg-slate-800">
                Accedi
            </button>
            }
        </div>
    </div>
</header>
<main class="mx-auto w-full max-w-5xl flex-1 px-4 py-6">
    <router-outlet />
</main>
<footer class="border-t border-slate-200 py-4 text-center text-xs text-slate-500 dark:border-slate-800 dark:text-slate-400">
    <a routerLink="/privacy" class="hover:underline">Privacy</a>
    <span class="mx-2" aria-hidden="true">·</span>
    <a routerLink="/termini" class="hover:underline">Termini d'uso</a>
</footer>
</div>
