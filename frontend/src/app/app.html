<header class="border-b border-slate-200 bg-white">
    <div class="mx-auto flex max-w-5xl flex-col gap-2 px-4 py-3 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-6">
            <a routerLink="/" class="flex items-center">
                <img src="logo-orizzontale.svg" alt="Leggio18" class="h-8 dark:hidden">
                <img src="logo-orizzontale-scuro.svg" alt="Leggio18" class="h-8 hidden dark:block">
            </a>
            <nav class="flex gap-4 text-sm font-medium">
                <a routerLink="/documenti" routerLinkActive ariaCurrentWhenActive="page"
                    class="text-slate-600 hover:text-blue-600 aria-[current=page]:text-blue-600">Documenti</a>
                <a routerLink="/chat" routerLinkActive ariaCurrentWhenActive="page"
                    class="text-slate-600 hover:text-blue-600 aria-[current=page]:text-blue-600">Chat</a>
                <a routerLink="/chiedi" routerLinkActive ariaCurrentWhenActive="page"
                    class="text-slate-600 hover:text-blue-600 aria-[current=page]:text-blue-600">Chiedi</a>
                @if (admin) {
                <a routerLink="/admin" routerLinkActive ariaCurrentWhenActive="page"
                    class="text-slate-600 hover:text-blue-600 aria-[current=page]:text-blue-600">Amministrazione</a>
                }
            </nav>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-sm text-slate-600">
                Ciao <strong class="font-semibold text-slate-900">{{ nomeUtente }}</strong>
            </span>
            <button type="button" (click)="esci()"
                class="cursor-pointer rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">
                Esci
            </button>
            <button type="button" (click)="cambiaPassword()"
                class="cursor-pointer rounded-lg border border-slate-300 px-3 py-1.5 text-sm font-medium text-slate-700 hover:bg-slate-100">
                Cambia password
            </button>
        </div>
    </div>
</header>

<main class="mx-auto max-w-5xl px-4 py-6">
    <router-outlet />
</main>
