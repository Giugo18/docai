<section class="flex flex-col gap-6">
  <div class="rounded-xl border border-slate-200 bg-white p-5 dark:border-slate-800 dark:bg-slate-900">
    <h1 class="mb-3 text-lg font-semibold text-slate-900 dark:text-slate-100">Chiedi a Leggio18</h1>
    <textarea
      rows="3"
      placeholder="Scrivi una domanda…"
      aria-label="La tua domanda"
      [value]="domanda()"
      (input)="scrivi($event)"
      (keydown.enter)="$event.preventDefault(); invia()"
      class="w-full resize-y rounded-lg border border-slate-300 bg-white p-3 text-slate-900 focus:border-inchiostro focus:outline-none dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 dark:placeholder:text-slate-500 dark:focus:border-ambra"></textarea>
    <div class="mt-3 flex items-center justify-between gap-3">
      <span class="text-sm text-slate-500 dark:text-slate-400">Invio per inviare, Maiusc+Invio per andare a capo</span>
      <button
        type="button"
        (click)="invia()"
        [disabled]="inCorso() || !domanda().trim()"
        class="rounded-lg bg-inchiostro px-4 py-2 font-medium text-white hover:bg-[#16304F] disabled:opacity-50 dark:bg-ambra dark:text-notte dark:hover:bg-[#F0B85F]">
        {{ inCorso() ? 'Sto scrivendo…' : 'Invia' }}
      </button>
    </div>
  </div>

  @if (errore()) {
    <p class="text-red-700 dark:text-red-400">{{ errore() }}</p>
  }

  @if (risposta() || inCorso()) {
    <div class="whitespace-pre-wrap rounded-xl border border-slate-200 bg-white p-5 leading-relaxed text-slate-900 dark:border-slate-800 dark:bg-slate-900 dark:text-slate-100">{{ risposta() }}@if (inCorso()) {<span class="ml-0.5 inline-block animate-pulse">▍</span>}</div>
  }
</section>
