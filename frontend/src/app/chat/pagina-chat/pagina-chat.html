<section class="flex flex-col gap-6">
  <div class="rounded-xl border border-slate-200 bg-white p-5">
    <h1 class="mb-3 text-lg font-semibold">Chiedi a DocAI</h1>
    <textarea
      rows="3"
      placeholder="Scrivi una domanda…"
      [value]="domanda()"
      (input)="scrivi($event)"
      (keydown.enter)="$event.preventDefault(); invia()"
      class="w-full resize-y rounded-lg border border-slate-300 p-3 focus:border-blue-600 focus:outline-none"></textarea>
    <div class="mt-3 flex items-center justify-between gap-3">
      <span class="text-sm text-slate-500">Invio per inviare, Maiusc+Invio per andare a capo</span>
      <button
        type="button"
        (click)="invia()"
        [disabled]="inCorso() || !domanda().trim()"
        class="rounded-lg bg-blue-600 px-4 py-2 font-medium text-white hover:bg-blue-700 disabled:bg-blue-300">
        {{ inCorso() ? 'Sto scrivendo…' : 'Invia' }}
      </button>
    </div>
  </div>

  @if (errore()) {
    <p class="text-red-700">{{ errore() }}</p>
  }

  @if (risposta() || inCorso()) {
    <div class="whitespace-pre-wrap rounded-xl border border-slate-200 bg-white p-5 leading-relaxed">{{ risposta() }}@if (inCorso()) {<span class="ml-0.5 inline-block animate-pulse">▍</span>}</div>
  }
</section>
