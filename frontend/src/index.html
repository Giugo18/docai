<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Leggio18</title>

  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>
  (function () {
    var scelta = 'sistema';
    try { scelta = localStorage.getItem('leggio18.tema') || 'sistema'; } catch (e) {}
    var scuro = scelta === 'scuro' ||
      (scelta === 'sistema' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (scuro) document.documentElement.classList.add('dark');
  })();
</script>
</head>

<body class="bg-slate-50 text-slate-900">
  <app-root></app-root>
</body>

</html>
