# Infrastruttura locale di DocAI.
# Sviluppo quotidiano:  docker compose up -d postgres keycloak   (l'app la avvii dall'IDE)
# Dalla settimana 6:    docker compose --profile ai up -d        (aggiunge Ollama)
# Tutto containerizzato (settimana 5): docker compose --profile ai --profile app up -d --build

services:
  postgres:
    image: pgvector/pgvector:pg17        # Postgres con l'estensione pgvector già installata
    container_name: docai-postgres
    environment:
      POSTGRES_DB: docai
      POSTGRES_USER: docai
      POSTGRES_PASSWORD: docai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docai"]
      interval: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    container_name: docai-keycloak
    command: start --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # dati in Postgres invece che nel container
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: docai
      KC_DB_PASSWORD: docai
      # l'indirizzo con cui il browser raggiunge Keycloak: diventa l'"iss" dei token
      KC_HOSTNAME: http://localhost:8180
      # in locale niente HTTPS (sul server lo farà Caddy)
      KC_HTTP_ENABLED: "true"
      # endpoint /health/ready sulla porta di management 9000
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
      - ./keycloak/themes/docai:/opt/keycloak/themes/docai
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'HTTP/1.1 200' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ollama:
    image: ollama/ollama
    container_name: docai-ollama
    profiles: ["ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama

  app:
    build: ./backend
    container_name: docai-app
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/docai
      # i token li chiede il browser a localhost:8180: questo è il loro "iss"
      ISSUER_URI: http://localhost:8180/realms/docai
      # le chiavi invece il backend le scarica dentro la rete Docker
      JWK_SET_URI: http://keycloak:8080/realms/docai/protocol/openid-connect/certs
    ports:
      - "8080:8080"   # comodo per le prove da PowerShell; online non sarà esposto

  frontend:
    build: ./frontend
    container_name: docai-frontend
    profiles: ["app"]
    depends_on:
      - app
    ports:
      - "8081:80"

volumes:
  pgdata:
  ollama:
