name: Backend

on:
  push:
    branches: [main]
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']

permissions:
  contents: read                       # di base i job leggono il codice e basta

concurrency:
  group: backend-${{ github.ref }}     # due push di fila: il primo giro viene annullato
  cancel-in-progress: true

jobs:
  test:
    name: Test (Java 21, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    env:
      # Nei test il modello è finto: serve solo un valore perché il contesto Spring parta.
      # NON è un segreto e non deve mai esserlo: la chiave vera non entra nella CI.
      GROQ_API_KEY: chiave-finta-per-i-test

    steps:
      - name: Codice
        uses: actions/checkout@v7

      - name: Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven                        # riusa ~/.m2 tra un giro e l'altro
          cache-dependency-path: backend/pom.xml

      - name: Test
        run: mvn -B -ntp verify               # -B: niente colori interattivi, -ntp: niente log dei download

      - name: Report dei test (solo se falliscono)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-test
          path: backend/target/surefire-reports/

  immagine:
    name: Immagine Docker
    needs: test                               # parte solo se i test sono verdi
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'   # non sulle PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write                         # pubblicare su GHCR

    steps:
      - name: Codice
        uses: actions/checkout@v7

      - name: QEMU (per i pochi comandi dello stadio finale arm64)
        uses: docker/setup-qemu-action@v4

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login a GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push (amd64 per i PC, arm64 per il server)
        uses: docker/build-push-action@v7
        with:
          context: backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/giugo18/docai-backend:${{ github.sha }}
            ghcr.io/giugo18/docai-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max