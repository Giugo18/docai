# Produzione: si somma a docker-compose.yml. Il server NON compila: scarica le immagini da GHCR.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ai --profile app pull app frontend
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile ai --profile app up -d
# Versione precisa (rollback): VERSIONE=<sha del commit> davanti ai due comandi

services:
  caddy:
    image: caddy:2-alpine
    container_name: docai-caddy
    profiles: ["app"]
    depends_on:
      - frontend
      - keycloak
    environment:
      DOMINIO: ${DOMINIO:?manca DOMINIO nel file .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificati: se si perdono, Caddy li richiede di nuovo
      - caddy_config:/config
    restart: unless-stopped

  # da Internet si entra solo da Caddy: niente porte per gli altri servizi
  postgres:
    ports: !reset []
    restart: unless-stopped

  keycloak:
    ports: !override ["127.0.0.1:8180:8080"]   # sostituisce le porte del file base: solo dal server stesso
    environment:
      KC_PROXY_HEADERS: xforwarded               # fidati degli header X-Forwarded-* mandati da Caddy
      KC_HOSTNAME_ADMIN: http://localhost:8181   # console admin solo nel tunnel: ssh -L 8181:127.0.0.1:8180
      KC_CACHE: local                            # una sola istanza: niente cluster
    restart: unless-stopped

  # Embeddings (bge-m3) calcolati sul server: il testo dei documenti non esce per l'indicizzazione.
  # Ollama non ha autenticazione: MAI pubblicare la 11434 (Docker scavalca ufw).
  # L'app lo raggiunge nella rete interna come http://ollama:11434
  ollama:
    ports: !reset []
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1   # un solo modello in memoria
      OLLAMA_NUM_PARALLEL: 1        # una richiesta alla volta: con 2 core è più veloce che dividerli
    restart: unless-stopped

  app:
    build: !reset {}                                                  # in produzione NON si compila
    image: ghcr.io/giugo18/docai-backend:${VERSIONE:-latest}          # si scarica da GHCR
    ports: !reset []
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?manca GROQ_API_KEY nel file .env}
    restart: unless-stopped

  frontend:
    build: !reset {}
    image: ghcr.io/giugo18/docai-frontend:${VERSIONE:-latest}
    ports: !reset []
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config: